# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Shared across every module (common, fabric, neoforge).
minecraft_version=26.3
java_version=25

# Mod properties.
version=1.3.0+26.3
group=com.scr0ols.soundtweaks
mod_id=soundtweaks
mod_name=SoundTweaks

# Fabric.
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.161.0+26.3

# Build tooling for the common module (vanilla Minecraft through NeoForm).
neoforge_moddev_version=2.0.148
neo_form_version=26.3-1

junit_version=6.1.3

# NeoForge. 26.3 has only beta builds so far.
# check these on https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
neo_version=26.3.0.51-beta
minecraft_version_range=[26.3,26.4)
